<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <style>
      .navy-fill { fill: #002B49; }
      .red-fill { fill: #E31837; }
      .red-stroke { stroke: #E31837; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .text-express { font-family: 'Arial Black', 'Impact', sans-serif; font-style: italic; font-weight: 900; font-size: 34px; letter-spacing: 4px; fill: #E31837; }
      .speed-line { stroke: #002B49; stroke-width: 3.5; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Main KDM Lettering (Italic / Speed Slant) -->
  <g transform="skewX(-14) translate(30, 0)">
    <!-- Letter K -->
    <path class="navy-fill" d="M 40,20 L 70,20 L 70,52 L 105,20 L 138,20 L 98,58 L 142,98 L 108,98 L 70,64 L 70,98 L 40,98 Z"/>

    <!-- Letter D with Cart inside -->
    <path class="navy-fill" d="M 145,20 L 200,20 C 240,20 260,35 260,59 C 260,83 240,98 200,98 L 145,98 Z M 175,42 L 175,76 L 195,76 C 218,76 228,68 228,59 C 228,50 218,42 195,42 Z"/>
    
    <!-- Red Shopping Cart Icon inside D -->
    <g transform="translate(182, 45) scale(0.75)">
      <!-- Cart speed lines -->
      <line x1="2" y1="10" x2="10" y2="10" class="red-stroke" />
      <line x1="-2" y1="16" x2="8" y2="16" class="red-stroke" />
      <line x1="4" y1="22" x2="12" y2="22" class="red-stroke" />
      <!-- Cart body -->
      <path class="red-fill" d="M 14,8 L 42,8 L 36,26 L 18,26 Z"/>
      <!-- Grid lines in cart -->
      <line x1="23" y1="8" x2="21" y2="26" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="32" y1="8" x2="30" y2="26" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="16" y1="17" x2="39" y2="17" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Cart handle & wheels -->
      <path class="red-fill" d="M 10,4 L 15,4 L 19,28 L 38,28 L 38,31 L 17,31 Z"/>
      <circle cx="21" cy="34" r="3.5" class="red-fill"/>
      <circle cx="34" cy="34" r="3.5" class="red-fill"/>
    </g>

    <!-- Letter M -->
    <path class="navy-fill" d="M 268,20 L 298,20 L 325,65 L 352,20 L 372,20 L 372,98 L 344,98 L 344,52 L 325,82 L 305,52 L 305,98 L 268,98 Z"/>
    <!-- Red Diagonal Stroke on M -->
    <path class="red-fill" d="M 352,20 L 382,20 L 358,98 L 344,98 Z"/>
  </g>

  <!-- Bottom EXPRESS Bar -->
  <!-- Left Speed Lines -->
  <line x1="25" y1="118" x2="85" y2="118" class="speed-line" />
  <line x1="40" y1="124" x2="85" y2="124" class="speed-line" />
  <line x1="55" y1="130" x2="85" y2="130" class="speed-line" />

  <!-- EXPRESS Text -->
  <text x="250" y="128" text-anchor="middle" class="text-express">EXPRESS</text>

  <!-- Right Speed Lines -->
  <line x1="415" y1="118" x2="475" y2="118" class="speed-line" />
  <line x1="415" y1="124" x2="460" y2="124" class="speed-line" />
  <line x1="415" y1="130" x2="445" y2="130" class="speed-line" />
</svg>
